services:

  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_TAG}
    container_name: prostart-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - prostart-net

  db:
    image: timescale/timescaledb:${TIMESCALE_TAG}
    container_name: prostart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: 2
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d/:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prostart-net

  nodered:
    image: nodered/node-red:${NODERED_TAG}
    container_name: prostart-nodered
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    networks:
      - prostart-net

  grafana:
    image: grafana/grafana-oss:${GRAFANA_TAG}
    container_name: prostart-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - prostart-net

  nginx:
    image: nginx:${NGINX_TAG}
    container_name: prostart-nginx
    restart: unless-stopped
    depends_on:
      - grafana
      - nodered
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prostart-net

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_TAG}
    container_name: prostart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - prostart-net

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
  grafana_data:
  pgadmin_data:

networks:
  prostart-net:
    driver: bridge
